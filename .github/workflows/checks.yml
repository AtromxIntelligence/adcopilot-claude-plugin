name: checks

# The structural half of this repository's gates, and the half that needs no
# credential of any kind. It runs on every push to main and every pull request.
#
# WHY IT CAN EXIST AT ALL. The old workflow was removed on 2026-09-26 for the
# plugin directory submission: its only way to install Claude Code on a runner
# was a piped shell installer, and the scanner holds a download-and-execute
# pattern anywhere in the repository, whoever published the script. Installing
# from npm at a pinned version is not that pattern, so the reason the old
# workflow had to go does not apply here.
#
# WHAT IT DELIBERATELY DOES NOT DO. It does not run the eval suite or the
# tools-only ablation. Those drive a model, which needs an authenticated Claude
# Code, and this job holds no secret — see "What CI runs, and what it does
# not" in the README for how they are run instead. `claude plugin validate`
# needs no auth at all: it reads local files, and is the only Claude Code
# command used here.
#
# Each check below exists because something it would have caught actually
# happened; the comment on each one says what.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  structural:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # The version-against-tag check reads tags, which a shallow
          # checkout does not fetch.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Pinned, not `@latest`: a gate whose own tool changes under it reports
      # yesterday's result as today's.
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.288

      # Both manifests, strictly. This is the pair the release checklist names,
      # and it is the only Claude Code command here — it reads files and needs
      # no credential, which is what makes this whole job keyless.
      - name: claude plugin validate --strict
        run: |
          set -euo pipefail
          claude plugin validate . --strict
          claude plugin validate .claude-plugin/plugin.json --strict

      # A manifest that does not parse takes the plugin out of the directory,
      # and `.mcp.json` not parsing takes the connector with it. Cheap, and it
      # fires before the validator's own error has to be interpreted.
      - name: Manifests parse
        run: |
          set -euo pipefail
          for f in .claude-plugin/plugin.json .claude-plugin/marketplace.json .mcp.json; do
            jq -e . "$f" >/dev/null \
              || { echo "::error file=$f::does not parse as JSON"; exit 1; }
            echo "ok  $f"
          done

      # A skill or command whose frontmatter lost its name or description stops
      # being discoverable, and nothing else in this job would notice: the
      # validator checks the manifests, not the bodies.
      - name: Every skill and command has name + description
        run: |
          set -euo pipefail
          rc=0
          for f in skills/*/SKILL.md commands/*.md; do
            [ -e "$f" ] || continue
            head -n 20 "$f" | grep -q '^name:'        || { echo "::error file=$f::frontmatter has no name:"; rc=1; }
            head -n 20 "$f" | grep -q '^description:' || { echo "::error file=$f::frontmatter has no description:"; rc=1; }
          done
          [ "$rc" -eq 0 ] && echo "ok  all skills and commands carry name + description"
          exit "$rc"

      # The plugin's own text, checked without a model: the daily-habit block
      # identical in every flow that carries it, its stop condition naming the
      # server's fields, the unattended run read-only and marked
      # claude-scheduled, the instructions it hands over equal to AdCopilot's
      # recipe, the eval graders matching the offer they look for, no sales
      # wording where the model reads it, and every listed command present.
      # Stdlib only; the runner's python3 is enough.
      - name: Structural tests
        run: python3 -m unittest discover -s tests -v

      # The regression guard on the thing that cost this repository its CI. The
      # directory scanner holds a download-and-execute pattern ANYWHERE in the
      # repo — including, as we found on 2026-09-26, a README quoting the
      # command in the paragraph that explains why it was removed. This job's
      # own file is excluded: the comment at the top describes the pattern in
      # prose and must not trip its own check.
      - name: No download-and-execute pattern
        run: |
          set -uo pipefail
          hits=$(grep -rInE '(curl|wget)[^|;]*\|[[:space:]]*(sudo[[:space:]]+)?(ba)?sh' . \
                   --exclude-dir=.git --exclude=checks.yml || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "::error::a download-and-execute pattern is back. The plugin directory's scanner holds this for review wherever it appears, including in prose. Describe the command instead of quoting it."
            exit 1
          fi
          echo "ok  no piped-installer pattern"

      # Caught nothing for a week: v0.1.0 was tagged at a commit six behind
      # main, while the manifest and the tag both read 0.1.0, so everything
      # looked consistent and the published listing did not match the tag.
      # A manifest AHEAD of the latest tag is the normal pre-release state and
      # passes. A manifest BEHIND one means a bump was missed.
      - name: Manifest version is not behind the latest tag
        run: |
          set -euo pipefail
          manifest=$(jq -r .version .claude-plugin/plugin.json)
          tag=$(git tag --sort=-v:refname | head -1 || true)
          echo "manifest $manifest | latest tag ${tag:-(none)}"
          if [ -z "$tag" ]; then echo "ok  no tags yet"; exit 0; fi
          bare=${tag#v}
          lowest=$(printf '%s\n%s\n' "$manifest" "$bare" | sort -V | head -1)
          if [ "$manifest" = "$bare" ]; then
            echo "ok  manifest equals the latest tag"
          elif [ "$lowest" = "$bare" ]; then
            echo "ok  manifest is ahead of $tag — an unreleased bump"
          else
            echo "::error::the manifest ($manifest) is BEHIND the latest tag ($tag). Bump .claude-plugin/plugin.json before tagging."
            exit 1
          fi
