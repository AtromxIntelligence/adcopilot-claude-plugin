schema_version: "1.1"
name: habit-offer-code
description: >
  The same tenant and command as habit-offer-chat (fictional; every value is
  invented), but the customer says they are in Claude Code. The offer must be
  worded for Claude Code — a routine made with /schedule, which the plugin
  offers to run for them — not a claude.ai scheduled task, and still be one
  short offer with no steps before a yes, right after the first finding that
  puts a cost on something (0.2.11), not at the end. The check-in itself is
  habit-offer-chat's to judge; here only the reads that prove it ran are
  checked deterministically, and the offer is the rubric's.
tags: [habit]
runs: 2
execution:
  prompt: |
    /adcopilot:daily
    (context: I'm in Claude Code, in my terminal)
  max_turns: 14
  timeout_seconds: 300
  allowed_tools: [Skill]
graders:
  - name: reads-pacing
    type: regex
    target: mock_calls
    pattern: '"tool"\s*:\s*"[^"]*budget_pacing"'
    arm: with-only
  - name: adds-nothing-without-a-yes
    type: tool_used
    tool: mcp__plugin_adcopilot_adcopilot__add_negative_keywords
    min: 0
    max: 0
    arm: with-only
  - name: offer-names-schedule-with-the-value-line
    type: regex
    target: last_message
    pattern: 'would have caught[\s\S]{0,300}first morning[\s\S]{0,300}(?<![\w/])/schedule\b'
  - name: one-offer-for-claude-code-after-the-costly-finding
    type: llm
    focus: last_message
    weight: 2
    criteria: |
      The customer ran /adcopilot:daily in Claude Code. No schedule is set up yet, so the reply should make one short offer to turn this check into a daily habit as a Claude Code routine made with /schedule, right after the first finding that puts a cost on something (here the wasted searches). Judge only the offer.

      PASS only if all five hold:

      1. There is exactly one such offer, right after the first finding that puts a cost on something — not at the end of the reply and not before any finding. The reply may still end on a question about blocking the searches.
      2. It is tied to that finding and carries the value line: a check that runs by itself every weekday (at 8:07) would have caught it on its first morning; it only reads the account and never changes anything; it opens with "All clear" or "Needs a look" plus one yes/no fix.
      3. It is worded for Claude Code: a routine, /schedule, and an offer to set it up (run /schedule) for them. It does NOT send them to claude.ai's Scheduled page or describe a claude.ai scheduled task.
      4. It is short — one or two sentences — and it is an offer: no set-up steps or instructions to paste before they say yes.
      5. No sales, plan, price or upgrade wording, and no urgency.

      FAIL if any of the five is missing, or if there is no offer at all.
  - name: marks-plugin-use
    type: tool_used
    tool: mcp__plugin_adcopilot_adcopilot__get_org_context
    input_match: '^(?![\s\S]*"source"\s*:\s*"claude-plugin/\d+\.\d+\.\d+")'
    min: 0
    max: 0
    arm: with-only
