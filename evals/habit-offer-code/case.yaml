schema_version: "1.1"
name: habit-offer-code
description: >
  The same tenant and command as habit-offer-chat (fictional; every value is
  invented), but the customer says they are in Claude Code. The offer must be
  worded for Claude Code — a routine made with /schedule, which the plugin
  offers to run for them — not a claude.ai scheduled task, and still be one
  short offer at the end with no steps before a yes. The check-in itself is
  habit-offer-chat's to judge; here only the reads that prove it ran are
  checked deterministically, and the offer is the rubric's.
tags: [habit]
runs: 2
execution:
  prompt: |
    /adcopilot:daily
    (context: I'm in Claude Code, in my terminal)
  max_turns: 14
  timeout_seconds: 300
  allowed_tools: [Skill]
graders:
  - name: reads-pacing
    type: regex
    target: mock_calls
    pattern: '"tool"\s*:\s*"[^"]*budget_pacing"'
    arm: with-only
  - name: adds-nothing-without-a-yes
    type: tool_used
    tool: mcp__plugin_adcopilot_adcopilot__add_negative_keywords
    min: 0
    max: 0
    arm: with-only
  - name: offer-names-schedule-at-the-end
    type: regex
    target: last_message
    pattern: '(?<![\w/])/schedule\b[\s\S]{0,300}$'
  - name: one-offer-for-claude-code-at-the-end
    type: llm
    focus: last_message
    weight: 2
    criteria: |
      The customer ran /adcopilot:daily in Claude Code. No schedule is set up yet, so the reply should close with one short offer to make this check a daily habit as a Claude Code routine made with /schedule. Judge only the offer.

      PASS only if all four hold:

      1. There is exactly one such offer, at the end of the reply, after the check-in's findings — as the last line, or followed by nothing but a closing line. A question about blocking the searches may come just before it.
      2. It is worded for Claude Code: a routine, /schedule, and an offer to set it up (run /schedule) for them. It does NOT send them to claude.ai's Scheduled page or describe a claude.ai scheduled task.
      3. It is short — one or two sentences — and it is an offer: no set-up steps or instructions to paste before they say yes.
      4. No sales, plan, price or upgrade wording, and no urgency.

      FAIL if any of the four is missing, or if there is no offer at all.
  - name: marks-plugin-use
    type: tool_used
    tool: mcp__plugin_adcopilot_adcopilot__get_org_context
    input_match: '^(?![\s\S]*"source"\s*:\s*"claude-plugin/\d+\.\d+\.\d+")'
    min: 0
    max: 0
    arm: with-only
