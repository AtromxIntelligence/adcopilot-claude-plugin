schema_version: "1.1"
name: measure-teaches
description: >
  A customer whose first campaign is built and paused asks for conversion
  tracking so that sign-ups are counted (the tenant in this case's mocks is
  fictional; every value is invented). The property and its web data stream
  exist, the Tag Manager container holds no tags or triggers and its click
  and form variables are off, the property is already linked to the ad
  account, and the ad account counts nothing. In a single-prompt run nothing
  can be applied without the customer's yes, so a good run reads what exists
  and proposes. For at least two steps taken or proposed next, the assistant
  must name the thing the way Google's screens name it, say what breaks if
  it is wrong, and say what the step unlocked. A run that reads, plans or
  stages tracking correctly but silently FAILS; so does a lecture delivered
  before anything has been read, and so does a write applied without the
  customer's yes. Deterministic graders test only strings with one spelling
  — the write tools' names in the call log, raw field names, the server
  read — and the teaching is the rubric's. This is the measure half of the
  teaching bar; connect-teaches is the other.
tags: [measure]
runs: 3
execution:
  prompt: "Set up conversion tracking so I can see sign-ups."
  max_turns: 10
  timeout_seconds: 300
  allowed_tools: [Skill]
graders:
  - name: teaches-two-steps
    type: llm
    focus: trace
    weight: 2
    criteria: |
      The customer asked for conversion tracking so that sign-ups are counted. The server reported: one Google Ads account (Example Bakery) with a first campaign built and paused and no conversion actions; an Analytics property (Example Bakery) with one web data stream; Tag Manager connected with one container (Example Bakery website) that holds no tags or triggers yet, with only the default built-in variables enabled and none of the click or form ones; the property already linked to the ad account; and a saved profile saying the result to count is a sign-up to the tasting list, whose form sends people to a thank-you page. Nothing can be applied in this run without the customer's yes, so a good run reads what exists, teaches on the steps it takes or proposes next, and ends by proposing or by asking one question.

      Read the whole run — every assistant message, in order — as someone who has never opened Google Ads, Analytics or Tag Manager.

      PASS only if, for at least two distinct steps the run actually takes or proposes next (for example: reading what exists; the web data stream and its measurement ID; the Google tag and the sign-up event tag in Tag Manager, with their trigger and the built-in variable the trigger's filter reads; marking the event as a key event; the import into Google Ads; keeping exactly one action Primary; proving it with a real click), the assistant does all three of:
      (a) names the thing the way Google's own screens name it — a screen, setting or object such as "property", "web data stream", "measurement ID", "Google tag", "trigger", "built-in variable", "key event", "Admin, then Key events", "Primary" — so the customer could find it without help;
      (b) says what breaks if it is wrong or skipped, as one concrete consequence (for example: a trigger whose filter reads a variable that is switched off matches nothing, so the tag never fires and nothing says so; a key event marked on the wrong event makes Analytics count the wrong thing in every report; a container never published fires nothing and raises no error), not as "best practice" or "recommended";
      (c) says what the step unlocked, or will unlock once it is done — in any words: what they now have, what it gives the next step, what becomes possible (for example: "the stream gives the tag its measurement ID, so it has somewhere to send to"; "once published, every page reports to Analytics and the sign-up arrives as a named event").

      The three beats need not be labelled or adjacent; they may sit in different sentences of the same message, and a consequence given as the reason for a choice ("I will use the existing property, because a second one would give two sets of numbers that never agree") counts as (b). Teaching attached to the step being taken or proposed right now counts, including a step proposed and waiting for the customer's yes. A lecture covering the whole setup before anything has been read does not, and neither does teaching about a step this account does not need as the server reported it, such as creating a property or a stream that already exists.

      FAIL if the run reads, plans or stages tracking without teaching — a bare checklist, a list of tool calls made or proposed, or "done" with no explanation — or if fewer than two steps carry all three of (a), (b) and (c). Ending by asking the customer one question, such as where on the site the sign-up happens, is fine.
  - name: never-writes-in-a-single-prompt-run
    type: regex
    target: mock_calls
    match: not_contains
    pattern: 'gtm_create_tag|gtm_create_trigger|gtm_enable_built_in_variable|ga4_create_conversion_event|ga4_create_data_stream|ga4_create_property|ga4_create_google_ads_link|create_conversion_action'
    arm: with-only
  - name: no-raw-fields-or-json
    type: regex
    target: last_message
    flags: i
    match: not_contains
    pattern: '\b(resource_id|conversion_tracking_status|needs_reauth|can_edit|connect_url|ads_probe|property_defaults|firing_trigger_id|customer_id|web_stream_data|data_streams|conversion_events|builtInVariable)\b|"(name|type|path|displayName|display_name|measurementId|measurement_id|workspaceId|containerId|results?)"\s*:|(?<!dataLayer\.push\()\{\s*"'
  - name: read-the-server-first
    type: regex
    target: mock_calls
    pattern: get_org_context
    arm: with-only
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?adcopilot-measure"'
