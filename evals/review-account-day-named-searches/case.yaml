schema_version: "1.1"
name: review-account-day-named-searches
description: >
  "How are my ads doing?" on a counted account in India (the tenant in this
  case's mocks is fictional; every value is invented), asked at 20:55 UTC on
  13 Oct, 02:25 on 14 Oct where the account is: the account's yesterday is
  13 Oct, UTC's is 12 Oct. It grades two things AdCopilot v2.41.0 changed.
  First, one clock (D185, #832): the audit's window and the other analysis
  windows end on the account's own last full day, so `last_30d`,
  `full_audit`, `analyze_search_terms`, `analyze_waste` and
  `conversion_setup_audit` end on 2026-10-13, while this month's pacing and
  the change log run through the account's today, 2026-10-14, as v2.41.0's
  `account_month_bounds` and `change_event_window` give them. The review ends
  its own `search` reads on 2026-10-13 and says one set of dates; the tag
  finding names its seven days (7 Oct to 13 Oct), the wasted-spend finding
  (G16) gives its window only as a length, and the health line counts the
  checks that gave a result (58 of 73), as v2.41.0 words them (#822), and an
  account set up outside the US is not graded against the US click-through
  average.
  Second, the costliest searches are named (#820): `analyze_search_terms`
  returns "Costliest search terms with no conversion" with each search's
  clicks and cost, and the review names the top ones rather than counting
  them. `get_org_context`'s situation, overlays, next_step, playbook and
  cross_reads are what release/v2.41.0's own code renders for this state,
  and G16 and the search-terms findings are its evaluators' own. The
  fixtures are dated and the run is not, so the dates graded are the
  results'.
tags: [review]
runs: 3
execution:
  prompt: "How are my ads doing?"
  max_turns: 16
  timeout_seconds: 420
  allowed_tools: [Skill]
graders:
  - name: search-ends-on-the-accounts-yesterday
    type: regex
    target: mock_calls
    # A `search` call that ends on 2026-10-13, the date_range.end the audit and
    # the analysis lenses carry (the account's yesterday): as its end_date, or
    # in its conditions as the end of a `segments.date BETWEEN ... AND ...`, a
    # `<=` bound, a `<` bound on the day after, or a single day (`=`), with the
    # date in single or double quotes. The input is written either as an
    # object or as an escaped JSON string (a double quote then reads \" or
    # \\\"); [^{}] keeps the match inside the one call's own input.
    pattern: '"tool"\s*:\s*"[^"]*search"\s*,\s*"input"\s*:\s*"?\{[^{}]*?(?:\\?"end_date\\?"\s*:\s*\\?"2026-10-13|[Bb][Ee][Tt][Ww][Ee][Ee][Nn]\s+(?:''|\\{1,3}")\d{4}-\d{2}-\d{2}(?:''|\\{1,3}")\s+[Aa][Nn][Dd]\s+(?:''|\\{1,3}")2026-10-13(?:''|\\{1,3}")|<=\s*(?:''|\\{1,3}")2026-10-13(?:''|\\{1,3}")|<(?!=)\s*(?:''|\\{1,3}")2026-10-14(?:''|\\{1,3}")|(?<![<>!])=\s*(?:''|\\{1,3}")2026-10-13(?:''|\\{1,3}"))'
  - name: no-search-ends-on-another-day
    type: regex
    target: mock_calls
    match: not_contains
    # No `search` read ends on a wrong day: not UTC's yesterday (12 Oct),
    # not the account's unfinished today (14 Oct, where this month's pacing
    # and the change log end), and not any later date worked out from the
    # clock of the machine the eval runs on (it runs after the v2.41.0
    # deploy, so after 13 Oct), whether as end_date or in its conditions as
    # the end of a BETWEEN, a <= bound, a < bound on the day after, or a single
    # day, in single or double quotes; nor a `DURING` range that takes in
    # today (TODAY, THIS_MONTH, THIS_WEEK_..._TODAY). A read for an earlier
    # comparison window (ending 29 Sep, say) is not a wrong day and passes.
    pattern: '"tool"\s*:\s*"[^"]*search"\s*,\s*"input"\s*:\s*"?\{[^{}]*?(?:\\?"end_date\\?"\s*:\s*\\?"(?:2026-10-12|2026-10-(?:1[4-9]|[23]\d)|2026-1[12]-\d{2}|20(?:2[7-9]|[3-9]\d)-\d{2}-\d{2})|[Bb][Ee][Tt][Ww][Ee][Ee][Nn]\s+(?:''|\\{1,3}")\d{4}-\d{2}-\d{2}(?:''|\\{1,3}")\s+[Aa][Nn][Dd]\s+(?:''|\\{1,3}")(?:2026-10-12|2026-10-(?:1[4-9]|[23]\d)|2026-1[12]-\d{2}|20(?:2[7-9]|[3-9]\d)-\d{2}-\d{2})(?:''|\\{1,3}")|<=\s*(?:''|\\{1,3}")(?:2026-10-12|2026-10-(?:1[4-9]|[23]\d)|2026-1[12]-\d{2}|20(?:2[7-9]|[3-9]\d)-\d{2}-\d{2})(?:''|\\{1,3}")|<(?!=)\s*(?:''|\\{1,3}")(?:2026-10-13|2026-10-(?:1[5-9]|[23]\d)|2026-1[12]-\d{2}|20(?:2[7-9]|[3-9]\d)-\d{2}-\d{2})(?:''|\\{1,3}")|(?<![<>!])=\s*(?:''|\\{1,3}")(?:2026-10-12|2026-10-(?:1[4-9]|[23]\d)|2026-1[12]-\d{2}|20(?:2[7-9]|[3-9]\d)-\d{2}-\d{2})(?:''|\\{1,3}")|[Dd][Uu][Rr][Ii][Nn][Gg]\s+(?:[Tt][Oo][Dd][Aa][Yy]|[Tt][Hh][Ii][Ss]_[Mm][Oo][Nn][Tt][Hh]|[Tt][Hh][Ii][Ss]_[Ww][Ee][Ee][Kk]_[Ss][Uu][Nn]_[Tt][Oo][Dd][Aa][Yy]|[Tt][Hh][Ii][Ss]_[Ww][Ee][Ee][Kk]_[Mm][Oo][Nn]_[Tt][Oo][Dd][Aa][Yy]))'
  - name: names-the-two-costliest-searches
    type: regex
    target: last_message
    flags: i
    pattern: '(?=[\s\S]*dentist jobs)(?=[\s\S]*free dental camp)'
  - name: coverage-is-a-count-not-a-percentage
    type: regex
    target: last_message
    flags: i
    match: not_contains
    # 0.2.11 said "73% of its 73 checks"; the result says "58 of 73 checks
    # gave a result". A percentage beside the 73, or as the coverage, fails.
    pattern: '\b\d{1,3}(?:\.\d+)?\s?%\s+of\s+(?:its\s+|the\s+|all\s+)?73\b|\bcoverage\b[^.\n]{0,24}\b\d{1,3}(?:\.\d+)?\s?%'
  - name: one-set-of-dates-and-named-searches
    type: llm
    focus: trace
    weight: 2
    criteria: |
      Judge the whole run: the tool calls and the final reply. The account is in India; the audit and the analysis reads end on 13 Oct 2026, the account's own yesterday: the audit covers 30 Sep to 13 Oct (its wasted-spend finding says "the last 14 days"), the tag finding's seven days are 7 Oct to 13 Oct, and results came in on 13 Oct. This month's pacing and the change log run from 1 Oct through 14 Oct, the account's today, the day in progress. `analyze_search_terms` listed the costliest searches with no conversion: dentist jobs bangalore (₹4,120), free dental camp (₹3,560), teeth whitening kit (₹2,890), 21 in all costing ₹18,240. The audit's health line said 58 of 73 checks gave a result, and the click-through check was not graded because the account is set up outside the US.

      PASS only if all four hold:
      1. One set of dates. The period the reply reports ends on 13 Oct (it may say 30 Sep to 13 Oct, or two weeks to 13 Oct), and no figure for that period, or for any of the audit's or the search terms' findings, is given for a window ending 12 Oct or 14 Oct. A finding's shorter window, if stated, is 7 Oct to 13 Oct. This month's pacing and the change log may be dated to 14 Oct, when they are given with their own dates and not as the period reported.
      2. The costliest searches are named with their cost in rupees: at least the top two by name. FAIL if the reply gives only a count of searches.
      3. Coverage is a count: in substance "58 of 73 checks", never a percentage.
      4. The click-through rate is not graded against a benchmark, an industry figure or a US average (the audit did not grade it, because the account is set up outside the US); comparing it with the account's own earlier days is fine.
  - name: no-change-without-a-yes
    type: regex
    target: mock_calls
    match: not_contains
    pattern: '"tool"\s*:\s*"[^"]*(?:add_negative_keywords|add_account_negatives|update_campaign|set_campaign_status|update_keyword|save_org_context)"'
  - name: marks-plugin-use
    type: tool_used
    # The same grader as every case that reads the server: a get_org_context
    # call without source "claude-plugin/<version>" fails it.
    tool: mcp__plugin_adcopilot_adcopilot__get_org_context
    input_match: '^(?![\s\S]*"source"\s*:\s*"claude-plugin/\d+\.\d+\.\d+")'
    min: 0
    max: 0
    arm: with-only
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?adcopilot-review"'
