schema_version: "1.1"
name: habit-offer-untold
description: >
  The same tenant and command as habit-offer-code (fictional; every value is
  invented), typed the way a real customer types it: the bare command, with
  no line saying where they are. Every other habit case says, and the
  daily-habit block believes what they say, so the tell it falls back on
  (Claude Code is where `claude mcp list` runs) is only exercised here. The
  eval harness is Claude Code, so the offer must be worded for Claude Code —
  a routine made with /schedule — not a claude.ai scheduled task, even though
  get_org_context reports "surface": "claude", which the server reports for
  Claude Code too. The claude.ai side of the tell cannot be run in this
  harness. The check-in itself is habit-offer-chat's to judge; here only the
  reads that prove it ran are checked deterministically, and the offer is the
  rubric's.
tags: [habit]
runs: 2
execution:
  prompt: |
    /adcopilot:daily
  max_turns: 14
  timeout_seconds: 300
  allowed_tools: [Skill]
graders:
  - name: reads-pacing
    type: regex
    target: mock_calls
    pattern: '"tool"\s*:\s*"[^"]*budget_pacing"'
    arm: with-only
  - name: adds-nothing-without-a-yes
    type: tool_used
    tool: mcp__plugin_adcopilot_adcopilot__add_negative_keywords
    min: 0
    max: 0
    arm: with-only
  - name: offer-names-schedule-with-the-value-line
    type: regex
    target: last_message
    pattern: 'would have caught[\s\S]{0,300}first morning[\s\S]{0,300}(?<![\w/])/schedule\b'
  - name: not-the-claude-chat-wording
    type: regex
    target: last_message
    flags: i
    match: not_contains
    pattern: 'Claude scheduled task|Scheduled page|Set up manually'
  - name: one-offer-for-claude-code-after-the-first-finding-it-reads
    type: llm
    focus: last_message
    weight: 2
    criteria: |
      The customer typed /adcopilot:daily and said nothing about where they are. They are in Claude Code. No schedule is set up yet, so the reply should make one short offer to turn this check into a daily habit as a Claude Code routine made with /schedule, right after the first finding the morning check also reads (here the wasted searches). Judge only the offer.

      PASS only if all five hold:

      1. There is exactly one such offer, right after the first finding the morning check also reads — not at the end of the reply and not before any finding. The reply may still end on a question about blocking the searches.
      2. It is tied to that finding and carries the value line: a check that runs by itself every weekday (at 8:07) would have caught it on its first morning; it only reads the account and never changes anything; it opens with "All clear" or "Needs a look" plus one yes/no fix.
      3. It is worded for Claude Code: a routine, /schedule, and an offer to set it up (run /schedule) for them. It does NOT send them to claude.ai's Scheduled page or describe a claude.ai scheduled task, and it does not offer both.
      4. It is short — one or two sentences — and it is an offer: no set-up steps or instructions to paste before they say yes.
      5. No sales, plan, price or upgrade wording, and no urgency.

      FAIL if any of the five is missing, or if there is no offer at all.
  - name: marks-plugin-use
    type: tool_used
    tool: mcp__plugin_adcopilot_adcopilot__get_org_context
    input_match: '^(?![\s\S]*"source"\s*:\s*"claude-plugin/\d+\.\d+\.\d+")'
    min: 0
    max: 0
    arm: with-only
