schema_version: "1.1"
name: review-question-first-roomy
description: >
  "How have my ads done over the last two weeks?" on an account that spends
  with nothing counted, on a plan with no daily limit (the tenant in this
  case's mocks is fictional; every value is invented; the state is
  review-uncapped-no-limit-words'). It grades what AdCopilot v2.41.0 changed
  for this turn. First, a question is answered first: the server hands the
  account to the measurement steps, and its next_step and playbook (rendered
  by release/v2.41.0's own code for this state) follow those steps only on a
  greeting, a request to get started or a question about counting results,
  and have anything else answered first and the steps offered after. So the
  review answers, and the conversion-tracking set-up is offered, not started.
  Second, eight reads: on a day with no daily limit v2.41.0 sizes an
  untracked account's answer at eight Google Ads reads, not five
  (`situations.ads_reads_max`, `roomy_day`), the five the branch names and
  up to three related reads, so an answer that follows the review's sequence
  makes more than five. Third, the costliest searches are named:
  `analyze_search_terms` returns v2.41.0's "Costliest search terms with no
  conversion", whose sentence says that with nothing recorded anywhere in the
  account they cost the most and are not proven waste. And no limit is
  claimed.
tags: [review]
runs: 3
execution:
  prompt: "How have my ads done over the last two weeks?"
  max_turns: 16
  timeout_seconds: 420
  allowed_tools: [Skill]
graders:
  - name: makes-more-than-five-google-ads-reads
    type: regex
    target: mock_calls
    # Six or more calls to a Google Ads read (a lens or `search`); the call
    # log writes each as "tool": "<name>". get_org_context and Search Console
    # reads are not counted. Five was the old size; v2.41.0 sizes this
    # answer at eight.
    pattern: '(?:"tool"\s*:\s*"[^"]*(?:full_audit|search|analyze_waste|analyze_search_terms|budget_pacing|conversion_setup_audit|change_history|bidding_audit|day_of_week|keyword_opportunities|quality_score_breakdown|rsa_asset_report|account_health_score|explain_conversion_gap)"[\s\S]*?){6}'
  - name: measurement-steps-offered-not-started
    type: tool_used
    # The measurement skill is offered after the answer, never run in it.
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?adcopilot-measure"'
    min: 0
    max: 0
    arm: with-only
  - name: answers-first-names-searches-offers-after
    type: llm
    focus: last_message
    weight: 2
    criteria: |
      Judge the final reply only; which tools ran is the call-log graders' job (a judge shown the whole run sees a trace with most of its Google Ads reads elided, as on 2026-10-18). The customer asked how their ads did over the last two weeks. The reads' fourteen days, 22 September to 5 October, spent $861 on 283 clicks with no result: $421 and 139 clicks in 22–28 September, $440 and 144 clicks in 29 September–5 October. The account spent $1,865 over thirty days on 607 clicks and counted nothing; its two primary conversion actions recorded nothing. The server's own instructions for this turn say the conversion-tracking steps are followed on a greeting, a request to get started or a question about counting results, and that anything else is answered first, with those steps offered after. `analyze_search_terms` returned "Costliest search terms with no conversion": custom cakes nyc ($61), birthday cakes brooklyn ($52), cake delivery manhattan ($47), cupcakes near me ($39) and gluten free bakery queens ($33), 27 in all costing $583, and said that with no conversion recorded anywhere in the account these are the searches that cost the most, not proven waste.

      PASS only if all four hold:
      1. The question is answered first, from the reads: spend, clicks and results over the two weeks with a comparison or the period's own figures, and the fact that nothing was counted. The reads in this run end on 5 October and today's date is later, so a note that the data stops there, or a request to check the account for the days since, is true and may come before the figures, as long as the reply then gives the latest two weeks it holds (spend, clicks and results) before any conversion-tracking set-up. FAIL if the gap, a reconnect check or a set-up walkthrough takes the answer's place.
      2. The costliest searches are named with their cost (at least two of the five above, by name), and they are not called proven waste: the reply says, in substance, that with nothing counted they cost the most but cannot yet be called waste, or that tracking should be checked before blocking them. FAIL if it gives only a count, or calls them wasted spend outright.
      3. Setting up conversion tracking is offered after the answer, as something to do next, and not started in this reply: no Tag Manager, Analytics or conversion-action steps are walked through as if under way.
      4. No limit is claimed: the reply never says a read limit, a quota or today's look-ups stopped it.
  - name: no-limit-words
    type: regex
    target: last_message
    flags: i
    match: not_contains
    # On a plan with no daily limit nothing was hit. Fails a claim of one: hit,
    # reached, ran out of, used up or exhausted, then a limit, cap, quota or
    # allowance, or then today's look-ups or reads; ran out of reads or
    # look-ups; the limit, cap or quota "was reached" or "has been used up";
    # or a read or look-up limit, cap or quota named outright. A negation
    # earlier in the same clause leaves it alone ("your plan has no look-up
    # limit", "you won't run into a read limit", "it hadn't hit its daily
    # limit"). A clause ends at punctuation, a dash, "but" or a joining word
    # (because, since, as, when, whenever, before, after, once, until, till,
    # so, while, though, although, and, then), so "I wasn't able to finish
    # because I hit the read limit" fails: its negation is in the other
    # clause. A campaign's budget, spend or per-click cap is not a read limit
    # and passes: a campaign as the verb's subject, a money amount after its
    # or their, or budget, spend, bid or CPC by the noun. The apostrophe is
    # allowed typed or curly; `flags: i` as in every other case here.
    pattern: '(?:^|(?<=[.!?]\s)|(?<=\n)|(?<=[,;:—–(]\s)|(?<=[—–(])|(?<=\s-\s)|(?<=\bbut\s)|(?<=\bbecause\s)|(?<=\bsince\s)|(?<=\bas\s)|(?<=\bwhen\s)|(?<=\bwhenever\s)|(?<=\bbefore\s)|(?<=\bafter\s)|(?<=\bonce\s)|(?<=\buntil\s)|(?<=\btill\s)|(?<=\bso\s)|(?<=\bwhile\s)|(?<=\bthough\s)|(?<=\balthough\s)|(?<=\band\s)|(?<=\bthen\s))(?:(?!\b(?:no|not|never|none|nothing|nobody|neither|nor|without|unlimited|cannot|won[’'']?t|wouldn[’'']?t|don[’'']?t|doesn[’'']?t|didn[’'']?t|can[’'']?t|\w+n[’'']t)\b)(?![.!?](?:\s|$))[^\n])*?(?:(?<!campaign\s)(?<!campaigns\s)(?<!campaign\shas\s)(?<!campaign\shad\s)(?<!campaigns\shave\s)(?<!campaigns\shad\s)\b(?:hit|hitting|reached|reaching|ran out of|run out of|runs out of|running out of|used up|using up|exhausted|maxed out)\b(?!\s+(?:its|their)\s+(?:[$€£₹]|\d))(?:(?!budget|spend|per[- ]click|\bbids?\b|\bcpc\b)[^.!?\n]){0,40}?\b(?:limits?|caps?|quotas?|allowances?)\b(?!\s+(?:of|on|for)\s+(?:(?:its|the|their|your|this|that)\s+)?(?:daily\s+)?(?:budget|spend|bids?|cpc)\b)|\b(?:hit|hitting|reached|reaching|ran out of|run out of|runs out of|running out of|used up|using up|exhausted|maxed out)\b[^.!?\n]{0,40}?\btoday[’'']?s\s+(?:look-?ups|reads)\b|\b(?:read|look-?up)s?\s+(?:limits?|caps?|quotas?)\b|\b(?:ran|run|runs|running)\s+out\s+of\s+(?:(?:my|the|your|today[’'']?s)\s+)?(?:reads|look-?ups)\b|\bout\s+of\s+(?:reads|look-?ups)\s+(?:for\s+)?today\b|\b(?:the|my|today[’'']?s|this\s+review[’'']?s|the\s+review[’'']?s)\s+(?:daily\s+)?(?:limits?|caps?|quotas?|allowances?)\s+(?:was|were|has\s+been|had\s+been|is\s+now)\s+(?:hit|reached|used\s+up|exhausted|maxed\s+out)\b)'
  - name: no-change-without-a-yes
    type: regex
    target: mock_calls
    match: not_contains
    pattern: '"tool"\s*:\s*"[^"]*(?:add_negative_keywords|add_account_negatives|update_campaign|set_campaign_status|update_keyword|save_org_context)"'
  - name: marks-plugin-use
    type: tool_used
    # The same grader as every case that reads the server: a get_org_context
    # call without source "claude-plugin/<version>" fails it.
    tool: mcp__plugin_adcopilot_adcopilot__get_org_context
    input_match: '^(?![\s\S]*"source"\s*:\s*"claude-plugin/\d+\.\d+\.\d+")'
    min: 0
    max: 0
    arm: with-only
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?adcopilot-review"'
