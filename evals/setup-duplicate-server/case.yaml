schema_version: "1.1"
name: setup-duplicate-server
description: >
  /adcopilot:setup on a machine where the customer had already added the
  connector by hand, from the website's instructions, before installing the
  plugin (the tenant in evals/mocks is fictional; every value is invented).
  Outside this harness Claude Code keeps the hand-added server and silently
  drops the plugin's, so the connector answers normally and nothing in any
  tool result says there are two. The prompt carries the one fact the
  customer can see: `claude mcp list` shows an `adcopilot` HTTP server they
  added, and no `plugin:adcopilot:adcopilot` line — the tell, seen both ways
  on a real machine. The reply must notice the duplicate, send them to remove
  it from every scope it can be in — `claude mcp remove adcopilot -s user`,
  and `-s local` from the directory it was added in, since a local
  registration belongs to that directory and one bare remove takes it out of
  one scope only (the founder's own install had it in both) — keep the
  plugin's, never tell them to remove the plugin, and still do setup's job: what the server reports as
  connected, in prose, and a next step. The harness registers the mock under
  the plugin's own server name, so a reply may observe that the plugin's copy
  answered this time; which copy answered is not judged. Deterministic graders
  test only strings with one spelling: the remedy command's name, raw field
  names (not the same words inside a connect address the server returned).
  Meaning is two rubrics along the case's seams — the duplicate and its
  scoped removal, the case's outcome, at weight 2 (dead alone: 5/7 = 0.714,
  below the gate); setup's job and the one next step at weight 1 — so a
  judge that disagrees about one obligation no longer fails the whole.
tags: [setup]
runs: 5
execution:
  prompt: |
    /adcopilot:setup
    (context: `claude mcp list` shows an `adcopilot` HTTP server added by the user, and no `plugin:adcopilot:adcopilot` line)
  max_turns: 8
  timeout_seconds: 240
  allowed_tools: [Skill]
graders:
  - name: names-the-remedy-command
    type: regex
    target: last_message
    flags: i
    pattern: 'claude mcp remove adcopilot\b'
  - name: no-raw-fields-or-json
    type: regex
    target: last_message
    flags: i
    match: not_contains
    pattern: '(?<!/)\b(connect_url|needs_reauth|can_edit|property_defaults|tools_revision|app_urls|cross_reads|search_console|google_ads)\b|"(connected|unlocks|gtm|ga4|products|overlays|situation|next_step|playbook)"\s*:|\{\s*"'
  - name: duplicate-noticed-and-removed-from-every-scope
    type: llm
    focus: last_message
    weight: 2
    criteria: |
      The customer ran /adcopilot:setup. The connector answered normally. The prompt also said that `claude mcp list` shows a bare `adcopilot` HTTP server the customer added by hand, and no `plugin:adcopilot:adcopilot` line. This plugin registers a connector of the same name, and Claude Code keeps a hand-added copy and silently ignores the plugin's. The harness registered the mock under the plugin's own name, so the reply may observe that the plugin's copy answered this call; which copy answered is not judged, and what the reply says the server reported is judged by another rubric and neither helps nor hurts here.

      Judge the reply's meaning only, as someone who first opened a terminal this week. PASS only if both hold:

      1. The duplicate is noticed. The reply takes the customer's `claude mcp list` as true, says there are two registrations of the same connector — one the customer added by hand and the plugin's — and treats the hand-added one as the duplicate to remove. It does not treat the plugin as broken, missing or not installed, does not say it cannot tell whether there is a duplicate, and does not make what to do conditional on the customer checking again first.

      2. Removed from every scope, the plugin's kept. The reply tells them to remove the hand-added one with `claude mcp remove adcopilot` from each scope it can be in — user scope (`-s user`) and local scope (`-s local`), the local one run from the directory it was added in because a local registration belongs to that directory — and to keep the plugin's; and it says how they will know it worked (`claude mcp list` shows the `plugin:adcopilot:adcopilot` line once theirs is gone). Mentioning `-s project` as well is fine. A reply that gives only one bare `claude mcp remove adcopilot` with no scope and no word about the scopes, or tells them to uninstall or remove the plugin, or to remove both, FAILS.

      FAIL if either is missing.
  - name: setups-job-and-one-next-step
    type: llm
    focus: last_message
    weight: 1
    criteria: |
      The customer ran /adcopilot:setup. The connector answered normally: Google Ads connected (one account, Example Bakery, no campaigns yet), Analytics connected with no property, Search Console connected but needing to be signed in again, Tag Manager not connected, and a fifth product the server calls lantern, not connected. The prompt also said a hand-added copy of the connector is registered; what the reply says about that duplicate is judged by another rubric and neither helps nor hurts here.

      Judge the reply's meaning only, as someone who first opened a terminal this week. PASS only if both hold:

      1. Setup's job still done. The reply says what the server reported as connected and what is not — in the customer's words, from the server's answer and not from a list of its own — and calls nothing unsupported. A short list or table in plain words is fine; the server's field names or JSON are not.

      2. One next step. The reply ends by pointing the customer at one next step with a reason — /adcopilot:launch (no campaigns yet) or /adcopilot:measure (nothing counted yet; the account has neither, and the skill's rule is one, not both) — or at re-running setup once the duplicate is removed. Either command is right here as long as it is one and the reason is given. Saying that re-approving Search Console or creating the Analytics property comes before it is fine, since the server reported both.

      FAIL if either is missing.
  - name: read-the-server-first
    type: regex
    target: mock_calls
    pattern: get_org_context
    arm: with-only
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?adcopilot-connect"'
